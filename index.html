<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lina Gabriela Castillo · Analista de datos</title>
    <meta name="description" content="Portafolio de Lina Gabriela Castillo, analista de datos. Proyectos de clasificación, clustering y modelos predictivos en Python, SQL y Power BI." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#060910" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Aplica el tema antes de pintar, para que no haya un "flash" blanco al entrar.
      (function () {
        try {
          var saved = localStorage.getItem('gc-theme');
          var dark = saved ? saved === 'dark' : true;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
